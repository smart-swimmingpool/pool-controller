; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[common]
; build_flags = -g -DDEBUG_PORT=Serial
;Add the PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY build flag to ensure reliable OTA updates.
build_flags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

serial_speed = 74880

[common_env_data]
lib_deps =
	DallasTemperature
	Wire
	paulstoffregen/OneWire
	Adafruit Unified Sensor
	DHT sensor library
	https://github.com/YuriiSalimov/RelayModule.git#v.1.1.2
	NTPClient @ 3.1.0
	TimeZone @ 1.2.4
	ArduinoJson @ 6.18.0
	thomasfredericks/Bounce2
	marvinroger/AsyncMqttClient
	homieiot/homie-esp8266 @ ^2.0.0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
	-D SERIAL_SPEED=${common.serial_speed}
	${common.build_flags}
build_unflags = -Werror=reorder
lib_deps =
	${common_env_data.lib_deps}
	; ESP32-specific: AsyncTCP implementation for ESP32
	mathieucarbou/AsyncTCP @ ^3.1.4
monitor_speed = ${common.serial_speed}

monitor_filters = esp32_exception_decoder, log2file, time, default

upload_speed = 230400
test_ignore = test_desktop

; Specify platform version for stability
platform_packages =
    framework-arduinoespressif32 @ https://github.com/platformio/platform-espressif32.git