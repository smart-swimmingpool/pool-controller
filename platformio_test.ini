; PlatformIO Project Configuration File for Unit Tests
; This file is for unit testing only and should not be used for production builds
;
[platformio]
env_default = test_desktop

[env:test_desktop]
platform = native
framework = 
board = 

; Build flags for unit testing
build_flags = 
    -D PIO_UNIT_TESTING
    -D PLATFORMIO=50000
    -D ESP32
    -I test
    -I src

; Library dependencies for testing
lib_deps =
    GoogleTest

; Source files - only include test files and mockable source files
src_build_flags = ${env.build_flags}
src_filter = +<test/*> +<src/Rule*.cpp> +<src/Rule*.hpp> +<src/Timer.cpp> +<src/Timer.hpp>

; Exclude hardware-dependent files
build_exclude_src = 
    src/main.cpp
    src/DallasTemperatureNode.cpp
    src/ESP32TemperatureNode.cpp
    src/RelayModuleNode.cpp
    src/OperationModeNode.cpp
    src/LoggerNode.cpp
    src/TimeClientHelper.cpp

; Test framework configuration
test_framework = google_test
test_port = /dev/null
