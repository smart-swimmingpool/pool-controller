; PlatformIO Project Configuration File for Unit Tests
; This file is for unit testing only and should not be used for production builds
;
[platformio]
env_default = test_desktop

[env:test_desktop]
platform = native
framework = 
board = 

; Build flags for unit testing
build_flags = 
    -D PIO_UNIT_TESTING
    -D PLATFORMIO=50000
    -I test
    -I src

; Library dependencies for testing
lib_deps =
    GoogleTest

; Source files
src_build_flags = ${env.build_flags}
src_filter = +<*> -<platform/*> -<*.ino>

; Test source files
test_src_filter = +<test/*> +<src/*>

; Exclude main.cpp from test build (we have our own test_main.cpp)
build_exclude_src = src/main.cpp

; Include test files
test_ignore = 

; Test framework configuration
test_framework = google_test
test_port = /dev/null
