# CPPLint configuration for pool-controller project
# Configuration reference: https://github.com/cpplint/cpplint

# Set line length to match .clang-format ColumnLimit
linelength=130

# Disable filters for embedded/Arduino-specific patterns and project conventions
# - legal/copyright: No copyright headers required for this project
# - build/include_subdir: Arduino libraries don't use subdirectories
# - build/include_what_you_use: Arduino framework handles includes
# - runtime/int: Arduino uses 'long' type extensively
# - runtime/threadsafe_fn: Single-threaded embedded environment
# - whitespace/indent: Project uses no indentation for class access specifiers (not Google style)
# - whitespace/blank_line: Project allows blank lines at start of code blocks
# - whitespace/comments: Project comment style varies (// vs ///)
# - whitespace/semicolon: Semicolons after constructors are acceptable
# - readability/inheritance: 'virtual override' is intentional for clarity
# - readability/braces: Semicolons after struct/class definitions are project style
# - readability/todo: TODOs without usernames are acceptable
# - readability/casting: C-style casts used in embedded context
filter=-legal/copyright,-build/include_subdir,-build/include_what_you_use,-runtime/int,-runtime/threadsafe_fn,-whitespace/indent,-whitespace/blank_line,-whitespace/comments,-whitespace/semicolon,-readability/inheritance,-readability/braces,-readability/todo,-readability/casting
