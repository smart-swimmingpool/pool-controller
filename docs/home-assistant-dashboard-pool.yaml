# Home Assistant Lovelace Dashboard (Raw configuration)
# Note: If your entity IDs differ, adjust the IDs below.
title: Pool Controller
views:
  - title: Pool
    path: pool
    icon: mdi:pool
    badges:
      - entity: select.pool_controller_mode
      - entity: switch.pool_controller_pool_pump
      - entity: switch.pool_controller_solar_pump
    cards:
      - type: entities
        title: Operation Mode
        show_header_toggle: false
        entities:
          - entity: select.pool_controller_mode
            name: Current Mode

      - type: grid
        title: Quick Switch
        columns: 4
        square: false
        cards:
          - type: button
            name: Auto
            icon: mdi:robot
            tap_action:
              action: call-service
              service: select.select_option
              target:
                entity_id: select.pool_controller_mode
              data:
                option: auto
          - type: button
            name: Timer
            icon: mdi:timer-outline
            tap_action:
              action: call-service
              service: select.select_option
              target:
                entity_id: select.pool_controller_mode
              data:
                option: timer
          - type: button
            name: Boost
            icon: mdi:rocket-launch
            tap_action:
              action: call-service
              service: select.select_option
              target:
                entity_id: select.pool_controller_mode
              data:
                option: boost
          - type: button
            name: Manual
            icon: mdi:hand-back-right
            tap_action:
              action: call-service
              service: select.select_option
              target:
                entity_id: select.pool_controller_mode
              data:
                option: manu

      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.pool_controller_pool_temp
            name: Pool Temperature
            unit: °C
            min: 0
            max: 45
            severity:
              green: 20
              yellow: 28
              red: 33
          - type: gauge
            entity: sensor.pool_controller_solar_temp
            name: Solar Storage Tank
            unit: °C
            min: 0
            max: 90
            severity:
              green: 35
              yellow: 50
              red: 70

  - title: Configuration
    path: configuration
    icon: mdi:tune
    cards:
      - type: entities
        title: Control Parameters
        show_header_toggle: false
        entities:
          - entity: number.pool_controller_pool_max_temp
            name: Max. Pool Temperature
          - entity: number.pool_controller_solar_min_temp
            name: Min. Water Storage Temperature
          - entity: number.pool_controller_hysteresis
            name: Hysteresis

      - type: entities
        title: Timer
        show_header_toggle: false
        entities:
          - entity: text.pool_controller_timer_start
            name: Start Time (HH:MM)
          - entity: text.pool_controller_timer_end
            name: End Time (HH:MM)

      - type: history-graph
        title: Switching Times & Temperatures (24h)
        hours_to_show: 24
        refresh_interval: 30
        entities:
          - entity: sensor.pool_controller_pool_temp
            name: Pool
          - entity: sensor.pool_controller_solar_temp
            name: Solar Storage Tank
          - entity: switch.pool_controller_pool_pump
            name: Pool Pump
          - entity: switch.pool_controller_solar_pump
            name: Solar Pump
