# Home Assistant Lovelace Dashboard (Raw configuration)
# Layout orientiert sich an der Pool Controller Web UI:
#   🏠 Dashboard → View "Pool"
#   🌊 Pool + 🕐 Zeit + 🔒 System → View "Konfiguration"
#
# ⚠️  Entity-IDs anpassen!
# Die tatsächlichen IDs in HA sind MAC-basiert: {domain}.{MAC}_{object_id}
#
# So findest du deine IDs:
#   1. In HA: Entwickler-Tools → Entities
#   2. Nach "pool" oder "controller" filtern
#   3. Domain + Namen in dieses YAML übernehmen
#
# Beispiel für MAC 3c:71:bf:1b:18:0c:
#   select.3c71bf1b180c_mode
#   sensor.3c71bf1b180c_pool_temp
#
# → Ersetze im ganzen YAML MAC durch deinen tatsächlichen Identifier.

title: Pool Controller
views:
  # ═══════════════════════════════════════════════
  # View 1: Pool — Dashboard + Steuerung
  # Entspricht Web UI: 🏠 Dashboard + 🌊 Pool
  # ═══════════════════════════════════════════════
  - title: Pool
    path: pool
    icon: mdi:pool
    badges:
      - entity: select.MAC_mode
        name: Mode
      - entity: switch.MAC_pool_pump
        name: Pool Pump
      - entity: switch.MAC_solar_pump
        name: Solar Pump

    cards:
      # ── Temperaturen (wie Web UI Dashboard) ──
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.MAC_pool_temp
            name: Pool Temperature
            unit: °C
            min: 0
            max: 45
            severity:
              green: 20
              yellow: 28
              red: 33
          - type: gauge
            entity: sensor.MAC_solar_temp
            name: Solar Storage Tank
            unit: °C
            min: 0
            max: 90
            severity:
              green: 35
              yellow: 50
              red: 70

      # ── Betriebsart (wie Web UI Mode-Karten) ──
      - type: grid
        title: Operation Mode
        columns: 4
        square: false
        cards:
          - type: button
            name: Auto
            icon: mdi:robot
            tap_action:
              action: call-service
              service: select.select_option
              target:
                entity_id: select.MAC_mode
              data:
                option: auto
          - type: button
            name: Timer
            icon: mdi:timer-outline
            tap_action:
              action: call-service
              service: select.select_option
              target:
                entity_id: select.MAC_mode
              data:
                option: timer
          - type: button
            name: Boost
            icon: mdi:rocket-launch
            tap_action:
              action: call-service
              service: select.select_option
              target:
                entity_id: select.MAC_mode
              data:
                option: boost
          - type: button
            name: Manual
            icon: mdi:hand-back-right
            tap_action:
              action: call-service
              service: select.select_option
              target:
                entity_id: select.MAC_mode
              data:
                option: manu

      # ── Aktueller Modus + Timer (wie Web UI 🌊 Pool) ──
      - type: entities
        title: Pool Settings
        show_header_toggle: false
        entities:
          - entity: select.MAC_mode
            name: Current Mode
          - entity: number.MAC_pool_max_temp
            name: Max. Pool Temperature
          - entity: number.MAC_solar_min_temp
            name: Min. Water Storage Temperature
          - entity: number.MAC_hysteresis
            name: Hysteresis
          - entity: time.MAC_timer_start
            name: Timer Start
          - entity: time.MAC_timer_end
            name: Timer End

      # ── Pumpenschalter (wie Web UI Pump-Indikatoren) ──
      - type: entities
        title: Pump Control
        show_header_toggle: false
        entities:
          - entity: switch.MAC_pool_pump
            name: Pool Pump
          - entity: switch.MAC_solar_pump
            name: Solar Pump

      # ── Temperaturverlauf (24h) ──
      - type: history-graph
        title: Temperatures & Pump States (24h)
        hours_to_show: 24
        refresh_interval: 30
        entities:
          - entity: sensor.MAC_pool_temp
            name: Pool
          - entity: sensor.MAC_solar_temp
            name: Solar Storage Tank
          - entity: switch.MAC_pool_pump
            name: Pool Pump
          - entity: switch.MAC_solar_pump
            name: Solar Pump

  # ═══════════════════════════════════════════════
  # View 2: Konfiguration — Zeit + System
  # Entspricht Web UI: 🕐 Zeit + 🔒 System
  # ═══════════════════════════════════════════════
  - title: Konfiguration
    path: konfiguration
    icon: mdi:tune

    cards:
      # ── Zeiteinstellungen (wie Web UI 🕐 Zeit) ──
      - type: entities
        title: Time & NTP
        show_header_toggle: false
        entities:
          - entity: select.MAC_timezone
            name: Timezone
          - entity: text.MAC_ntp_server
            name: NTP Server

      # ── System-Info (wie Web UI Dashboard-Zeile + System-Tab) ──
      - type: entities
        title: System
        show_header_toggle: false
        entities:
          - entity: sensor.MAC_local_time
            name: Local Time
          - entity: sensor.MAC_rssi
            name: WiFi Signal
          - entity: sensor.MAC_heap
            name: Free Heap
          - entity: sensor.MAC_uptime
            name: Uptime
          - entity: update.MAC_firmware_update
            name: Firmware
