---
codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: auto
        threshold: 5%

comment:
  layout: "header, diff, flags, components"
  behavior: default
  require_changes: false

ignore:
  - "test/**/*"
  - "lib/**/*"
