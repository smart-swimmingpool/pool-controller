---
###########################
## Setup PlatformIO      ##
###########################
## Composite action that centralizes the repeated PlatformIO setup:
## Python, pip install, and cache restore/save (tools + libdeps).
##
## All PlatformIO-based workflows should use this instead of
## duplicating the setup steps.
##
## Inputs:
##   python-version  Python version for PlatformIO (default 3.11)
##   pio-core-dir    PlatformIO core directory; exported as
##                   PLATFORMIO_CORE_DIR for subsequent steps (default ~/.platformio)
##   cache-key       Full cache key for the PlatformIO cache
##   restore-key     Restore key prefix for the PlatformIO cache
name: "Set up PlatformIO"
description: "Cache and install PlatformIO CLI with Python"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"
  pio-core-dir:
    description: "PlatformIO core directory (exported as PLATFORMIO_CORE_DIR)"
    required: false
    default: "~/.platformio"
  cache-key:
    description: "Cache key for the PlatformIO cache"
    required: false
    default: "${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}"
  restore-key:
    description: "Restore key prefix for the PlatformIO cache"
    required: false
    default: "${{ runner.os }}-pio-"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache PlatformIO
      uses: actions/cache@v6
      with:
        path: |
          ${{ inputs.pio-core-dir }}
          .pio
        key: ${{ inputs.cache-key }}
        restore-keys: |
          ${{ inputs.restore-key }}

    - name: Export PLATFORMIO_CORE_DIR
      shell: bash
      run: echo "PLATFORMIO_CORE_DIR=${{ inputs.pio-core-dir }}" >> "$GITHUB_ENV"

    - name: Install PlatformIO
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install platformio intelhex
