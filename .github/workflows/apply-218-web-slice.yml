name: Apply PR 218 web slice

on:
  push:
    branches:
      - refactor/adapter-command-snapshot-migration

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore(ci): apply #218 web slice'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused Web command migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}\n--- needle ---\n{old}")
              p.write_text(text.replace(old, new, 1))

          # ControllerCommandHandler: return resolved owner state for synchronous Web responses.
          replace_once(
              "src/ControllerCommandHandler.hpp",
              "namespace PoolController {\n\n/**\n * @brief Applies validated runtime commands to the legacy controller model.",
              "namespace PoolController {\n\n/** @brief Optional resolved owner state returned to synchronous adapters. */\nstruct ControllerCommandResult final {\n  bool hasMode{false};\n  OperationMode mode{OperationMode::AUTO};\n  bool hasPumpState{false};\n  bool pumpState{false};\n};\n\n/**\n * @brief Applies validated runtime commands to the legacy controller model."
          )
          replace_once(
              "src/ControllerCommandHandler.hpp",
              "  bool handle(const ControllerCommand &command);",
              "  bool handle(const ControllerCommand &command) { return handle(command, nullptr); }\n  bool handle(const ControllerCommand &command, ControllerCommandResult *result);"
          )

          replace_once(
              "src/ControllerCommandHandler.cpp",
              "bool inRange(float value, float minimum, float maximum) {\n  return value >= minimum && value <= maximum;\n}\n\n}  // namespace",
              "bool inRange(float value, float minimum, float maximum) {\n  return value >= minimum && value <= maximum;\n}\n\nOperationMode nextOperationMode(OperationMode current) {\n  switch (current) {\n  case OperationMode::AUTO:\n    return OperationMode::MANUAL;\n  case OperationMode::MANUAL:\n    return OperationMode::BOOST;\n  case OperationMode::BOOST:\n    return OperationMode::TIMER;\n  case OperationMode::TIMER:\n    return OperationMode::AUTO;\n  }\n  return OperationMode::AUTO;\n}\n\n}  // namespace"
          )
          replace_once(
              "src/ControllerCommandHandler.cpp",
              "bool ControllerCommandHandler::handle(const ControllerCommand &command) {",
              "bool ControllerCommandHandler::handle(const ControllerCommand &command, ControllerCommandResult *result) {"
          )
          replace_once(
              "src/ControllerCommandHandler.cpp",
              "  case ControllerCommandType::SET_MODE:\n    if (!dependencies_.operationMode.setMode(command.mode, sourceName(command.source))) {\n      return false;\n    }\n    settings.opMode = toString(command.mode);\n    return saveSettings();",
              "  case ControllerCommandType::SET_MODE:\n    if (!dependencies_.operationMode.setMode(command.mode, sourceName(command.source))) {\n      return false;\n    }\n    settings.opMode = toString(command.mode);\n    if (!saveSettings()) {\n      return false;\n    }\n    if (result != nullptr) {\n      result->hasMode = true;\n      result->mode = command.mode;\n    }\n    return true;\n\n  case ControllerCommandType::CYCLE_MODE: {\n    const OperationMode next = nextOperationMode(dependencies_.operationMode.getTypedMode());\n    if (!dependencies_.operationMode.setMode(next, sourceName(command.source))) {\n      return false;\n    }\n    settings.opMode = toString(next);\n    if (!saveSettings()) {\n      return false;\n    }\n    if (result != nullptr) {\n      result->hasMode = true;\n      result->mode = next;\n    }\n    return true;\n  }"
          )
          replace_once(
              "src/ControllerCommandHandler.cpp",
              "  case ControllerCommandType::SET_POOL_PUMP_MANUAL:\n  case ControllerCommandType::SET_SOLAR_PUMP_MANUAL:\n    if (dependencies_.operationMode.getTypedMode() != OperationMode::MANUAL) {\n      LOG_WARN(\"Controller command: manual pump request rejected outside manual mode\\n\");\n      return false;\n    }\n    if (command.type == ControllerCommandType::SET_POOL_PUMP_MANUAL) {\n      dependencies_.poolPump.setSwitch(command.enabled);\n    } else {\n      dependencies_.solarPump.setSwitch(command.enabled);\n    }\n    return true;\n\n  case ControllerCommandType::FACTORY_RESET: {",
              "  case ControllerCommandType::SET_POOL_PUMP_MANUAL:\n  case ControllerCommandType::SET_SOLAR_PUMP_MANUAL:\n    if (dependencies_.operationMode.getTypedMode() != OperationMode::MANUAL) {\n      LOG_WARN(\"Controller command: manual pump request rejected outside manual mode\\n\");\n      return false;\n    }\n    if (command.type == ControllerCommandType::SET_POOL_PUMP_MANUAL) {\n      dependencies_.poolPump.setSwitch(command.enabled);\n    } else {\n      dependencies_.solarPump.setSwitch(command.enabled);\n    }\n    return true;\n\n  case ControllerCommandType::TOGGLE_POOL_PUMP:\n  case ControllerCommandType::TOGGLE_SOLAR_PUMP: {\n    const OperationMode currentMode = dependencies_.operationMode.getTypedMode();\n    if (command.toggleModePolicy == PumpToggleModePolicy::REQUIRE_MANUAL && currentMode != OperationMode::MANUAL) {\n      LOG_WARN(\"Controller command: Web pump toggle rejected outside manual mode\\n\");\n      return false;\n    }\n    if (command.toggleModePolicy == PumpToggleModePolicy::ENTER_MANUAL && currentMode != OperationMode::MANUAL) {\n      if (!dependencies_.operationMode.setMode(OperationMode::MANUAL, sourceName(command.source))) {\n        return false;\n      }\n      settings.opMode = toString(OperationMode::MANUAL);\n      if (!saveSettings()) {\n        return false;\n      }\n    }\n\n    RelayModuleNode &pump = command.type == ControllerCommandType::TOGGLE_POOL_PUMP ? dependencies_.poolPump : dependencies_.solarPump;\n    const bool newState = !pump.getSwitch();\n    pump.setSwitch(newState);\n    if (result != nullptr) {\n      result->hasPumpState = true;\n      result->pumpState = newState;\n    }\n    return true;\n  }\n\n  case ControllerCommandType::FACTORY_RESET: {"
          )

          # WebPortal: inject the owner dispatcher and route only mode/pump mutations through it.
          replace_once(
              "src/WebPortal.hpp",
              '#include "LogCapture.hpp"',
              '#include "ControllerCommandHandler.hpp"\n#include "LogCapture.hpp"'
          )
          replace_once(
              "src/WebPortal.hpp",
              "  WebPortal() = default;\n\n  /** @brief Start the HTTP server and optional DNS captive portal. @return true if server started successfully. */",
              "  WebPortal() = default;\n\n  using CommandDispatcher = bool (*)(const ControllerCommand &, ControllerCommandResult *);\n  static void setCommandDispatcher(CommandDispatcher dispatcher) { commandDispatcher_ = dispatcher; }\n#if !defined(ESP32) && !defined(ARDUINO_ARCH_ESP32)\n  static bool invokeRouteForTest(const char *uri, int method) { return server_.invokeRoute(uri, method); }\n#endif\n\n  /** @brief Start the HTTP server and optional DNS captive portal. @return true if server started successfully. */"
          )
          replace_once(
              "src/WebPortal.hpp",
              "  static WebServer server_;\n  static DNSServer dnsServer_;",
              "  static WebServer server_;\n  static DNSServer dnsServer_;\n  static CommandDispatcher commandDispatcher_;"
          )

          replace_once(
              "src/WebPortal.cpp",
              "WebServer WebPortal::server_(80);\nDNSServer WebPortal::dnsServer_;",
              "WebServer WebPortal::server_(80);\nDNSServer WebPortal::dnsServer_;\nWebPortal::CommandDispatcher WebPortal::commandDispatcher_ = nullptr;"
          )
          replace_once(
              "src/WebPortal.cpp",
              '''void WebPortal::apiSetMode() {\n  if (!server_.hasArg("mode")) {\n    server_.send(400, "application/json", "{\\\"status\\\":\\\"error\\\",\\\"message\\\":\\\"Missing mode\\\"}");\n    return;\n  }\n\n  String mode = server_.arg("mode");\n  if (operationModeNode.setMode(mode, "web:apiSetMode")) {\n    ConfigManager::getSettings().opMode = mode;\n    ConfigManager::save();\n    server_.send(200, "application/json", "{\\\"status\\\":\\\"ok\\\",\\\"mode\\\":\\\"" + mode + "\\\"}");\n  } else {\n    server_.send(400, "application/json", "{\\\"status\\\":\\\"error\\\",\\\"message\\\":\\\"Invalid mode\\\"}");\n  }\n}\n\nvoid WebPortal::apiTogglePump() {\n  if (!server_.hasArg("pump")) {\n    server_.send(400, "application/json", "{\\\"status\\\":\\\"error\\\",\\\"message\\\":\\\"Missing pump parameter\\\"}");\n    return;\n  }\n\n  // Only allow pump toggling in manual mode\n  if (operationModeNode.getMode() != "manu") {\n    server_.send(400, "application/json", "{\\\"status\\\":\\\"error\\\",\\\"message\\\":\\\"Pump control only available in manual mode\\\"}");\n    return;\n  }\n\n  String pump = server_.arg("pump");\n  bool newState;\n\n  if (pump == "pool") {\n    newState = !poolPumpNode.getSwitch();\n    poolPumpNode.setSwitch(newState);\n  } else if (pump == "solar") {\n    newState = !solarPumpNode.getSwitch();\n    solarPumpNode.setSwitch(newState);\n  } else {\n    server_.send(400, "application/json", "{\\\"status\\\":\\\"error\\\",\\\"message\\\":\\\"Invalid pump. Use 'pool' or 'solar'\\\"}");\n    return;\n  }\n\n  String json = "{\\\"status\\\":\\\"ok\\\",\\\"state\\\":" + String(newState ? "true" : "false") + "}";\n  server_.send(200, "application/json", json);\n}\n''',
              '''void WebPortal::apiSetMode() {\n  if (!server_.hasArg("mode")) {\n    server_.send(400, "application/json", "{\\\"status\\\":\\\"error\\\",\\\"message\\\":\\\"Missing mode\\\"}");\n    return;\n  }\n\n  const String requestedMode = server_.arg("mode");\n  ControllerCommand command{};\n  command.source = CommandSource::WEB;\n\n  if (requestedMode == "cycle") {\n    command.type = ControllerCommandType::CYCLE_MODE;\n  } else {\n    OperationMode parsedMode;\n    if (!tryParseOperationMode(requestedMode.c_str(), parsedMode)) {\n      server_.send(400, "application/json", "{\\\"status\\\":\\\"error\\\",\\\"message\\\":\\\"Invalid mode\\\"}");\n      return;\n    }\n    command.type = ControllerCommandType::SET_MODE;\n    command.mode = parsedMode;\n  }\n\n  ControllerCommandResult result{};\n  if (commandDispatcher_ == nullptr || !commandDispatcher_(command, &result)) {\n    server_.send(400, "application/json", "{\\\"status\\\":\\\"error\\\",\\\"message\\\":\\\"Invalid mode\\\"}");\n    return;\n  }\n\n  const char *resolvedMode = requestedMode.c_str();\n  if (command.type == ControllerCommandType::CYCLE_MODE) {\n    if (!result.hasMode) {\n      server_.send(500, "application/json", "{\\\"status\\\":\\\"error\\\",\\\"message\\\":\\\"Missing command result\\\"}");\n      return;\n    }\n    resolvedMode = toString(result.mode);\n  }\n  server_.send(200, "application/json", "{\\\"status\\\":\\\"ok\\\",\\\"mode\\\":\\\"" + String(resolvedMode) + "\\\"}");\n}\n\nvoid WebPortal::apiTogglePump() {\n  if (!server_.hasArg("pump")) {\n    server_.send(400, "application/json", "{\\\"status\\\":\\\"error\\\",\\\"message\\\":\\\"Missing pump parameter\\\"}");\n    return;\n  }\n\n  const String pump = server_.arg("pump");\n  ControllerCommand command{};\n  command.source = CommandSource::WEB;\n  command.toggleModePolicy = PumpToggleModePolicy::REQUIRE_MANUAL;\n  if (pump == "pool") {\n    command.type = ControllerCommandType::TOGGLE_POOL_PUMP;\n  } else if (pump == "solar") {\n    command.type = ControllerCommandType::TOGGLE_SOLAR_PUMP;\n  } else {\n    server_.send(400, "application/json", "{\\\"status\\\":\\\"error\\\",\\\"message\\\":\\\"Invalid pump. Use 'pool' or 'solar'\\\"}");\n    return;\n  }\n\n  ControllerCommandResult result{};\n  if (commandDispatcher_ == nullptr || !commandDispatcher_(command, &result)) {\n    server_.send(400, "application/json", "{\\\"status\\\":\\\"error\\\",\\\"message\\\":\\\"Pump control only available in manual mode\\\"}");\n    return;\n  }\n  if (!result.hasPumpState) {\n    server_.send(500, "application/json", "{\\\"status\\\":\\\"error\\\",\\\"message\\\":\\\"Missing command result\\\"}");\n    return;\n  }\n\n  String json = "{\\\"status\\\":\\\"ok\\\",\\\"state\\\":" + String(result.pumpState ? "true" : "false") + "}";\n  server_.send(200, "application/json", json);\n}\n'''
          )

          # Composition root injects the same application-owned handler used by MQTT.
          replace_once(
              "src/main.cpp",
              '#include "PoolController.hpp"',
              '#include "PoolController.hpp"\n#include "WebPortal.hpp"'
          )
          replace_once(
              "src/main.cpp",
              "PoolController::MqttRuntimeCommandAdapter &mqttRuntimeCommandAdapter() {",
              "bool dispatchWebCommand(const PoolController::ControllerCommand &command, PoolController::ControllerCommandResult *result) {\n  return controllerCommandHandler().handle(command, result);\n}\n\nPoolController::MqttRuntimeCommandAdapter &mqttRuntimeCommandAdapter() {"
          )
          replace_once(
              "src/main.cpp",
              "  context.setup();\n\n  // MqttPublisher::begin()",
              "  PoolController::WebPortal::setCommandDispatcher(dispatchWebCommand);\n  context.setup();\n\n  // MqttPublisher::begin()"
          )

          # Native HTTP/command regression coverage.
          Path("test/native/tests/test_web_runtime_commands.cpp").write_text(r'''// Copyright (c) 2018-2026 Smart Swimming Pool, Stephan Strittmatter
// SPDX-License-Identifier: MIT

#include <cstring>

#include "ConfigManager.hpp"
#include "NetworkManager.hpp"
#include "Nodes.hpp"
#include "WebPortal.hpp"
#include "WebServer.h"

extern WebServerCapture wsCapture;
extern void test_begin(const char *suite, const char *name);
extern void test_pass(const char *file, int line);
extern void test_fail(const char *file, int line, const char *msg);
extern void test_suite_end(const char *name, int passed, int failed);

#define ASSERT_TRUE(cond)                                     \
  do {                                                        \
    if (!(cond)) {                                            \
      test_fail(__FILE__, __LINE__, "Expected true: " #cond); \
      return 1;                                               \
    }                                                         \
    test_pass(__FILE__, __LINE__);                            \
  } while (0)

#define ASSERT_EQ(a, b) ASSERT_TRUE((a) == (b))
#define ASSERT_STREQ(a, b) ASSERT_TRUE(std::strcmp((a), (b)) == 0)

namespace {

PoolController::ControllerCommand capturedCommand{};
PoolController::ControllerCommandResult configuredResult{};
bool dispatchCalled = false;
bool dispatchAccepted = true;

bool captureDispatch(const PoolController::ControllerCommand &command, PoolController::ControllerCommandResult *result) {
  dispatchCalled = true;
  capturedCommand = command;
  if (result != nullptr) {
    *result = configuredResult;
  }
  return dispatchAccepted;
}

void resetRequest() {
  wsCapture.clear();
  PoolController::ConfigManager::setConfigured(false);
  PoolController::NetworkManager::setApMode(true);
  PoolController::WebPortal::setCommandDispatcher(captureDispatch);
  dispatchCalled = false;
  dispatchAccepted = true;
  capturedCommand = {};
  configuredResult = {};
}

int test_missing_and_invalid_mode() {
  test_begin("WebRuntimeCommands", "mode validation preserves HTTP compatibility");
  resetRequest();
  ASSERT_TRUE(PoolController::WebPortal::invokeRouteForTest("/api/mode", HTTP_POST));
  ASSERT_EQ(wsCapture.lastStatusCode, 400);
  ASSERT_STREQ(wsCapture.lastBody.c_str(), "{\"status\":\"error\",\"message\":\"Missing mode\"}");
  ASSERT_TRUE(!dispatchCalled);

  resetRequest();
  wsCapture.args["mode"] = "invalid";
  ASSERT_TRUE(PoolController::WebPortal::invokeRouteForTest("/api/mode", HTTP_POST));
  ASSERT_EQ(wsCapture.lastStatusCode, 400);
  ASSERT_STREQ(wsCapture.lastBody.c_str(), "{\"status\":\"error\",\"message\":\"Invalid mode\"}");
  ASSERT_TRUE(!dispatchCalled);
  return 0;
}

int test_absolute_mode_command() {
  test_begin("WebRuntimeCommands", "absolute mode becomes a WEB typed command");
  resetRequest();
  wsCapture.args["mode"] = "boost";
  ASSERT_TRUE(PoolController::WebPortal::invokeRouteForTest("/api/mode", HTTP_POST));
  ASSERT_TRUE(dispatchCalled);
  ASSERT_EQ(capturedCommand.type, PoolController::ControllerCommandType::SET_MODE);
  ASSERT_EQ(capturedCommand.source, PoolController::CommandSource::WEB);
  ASSERT_EQ(capturedCommand.mode, PoolController::OperationMode::BOOST);
  ASSERT_EQ(wsCapture.lastStatusCode, 200);
  ASSERT_STREQ(wsCapture.lastBody.c_str(), "{\"status\":\"ok\",\"mode\":\"boost\"}");
  return 0;
}

int test_cycle_mode_command() {
  test_begin("WebRuntimeCommands", "cycle mode stays relative until the owner resolves it");
  resetRequest();
  wsCapture.args["mode"] = "cycle";
  configuredResult.hasMode = true;
  configuredResult.mode = PoolController::OperationMode::TIMER;
  ASSERT_TRUE(PoolController::WebPortal::invokeRouteForTest("/api/mode", HTTP_POST));
  ASSERT_TRUE(dispatchCalled);
  ASSERT_EQ(capturedCommand.type, PoolController::ControllerCommandType::CYCLE_MODE);
  ASSERT_EQ(capturedCommand.source, PoolController::CommandSource::WEB);
  ASSERT_EQ(wsCapture.lastStatusCode, 200);
  ASSERT_STREQ(wsCapture.lastBody.c_str(), "{\"status\":\"ok\",\"mode\":\"timer\"}");
  return 0;
}

int test_pump_validation() {
  test_begin("WebRuntimeCommands", "pump validation preserves HTTP compatibility");
  resetRequest();
  ASSERT_TRUE(PoolController::WebPortal::invokeRouteForTest("/api/pump", HTTP_POST));
  ASSERT_EQ(wsCapture.lastStatusCode, 400);
  ASSERT_STREQ(wsCapture.lastBody.c_str(), "{\"status\":\"error\",\"message\":\"Missing pump parameter\"}");
  ASSERT_TRUE(!dispatchCalled);

  resetRequest();
  wsCapture.args["pump"] = "invalid";
  ASSERT_TRUE(PoolController::WebPortal::invokeRouteForTest("/api/pump", HTTP_POST));
  ASSERT_EQ(wsCapture.lastStatusCode, 400);
  ASSERT_STREQ(wsCapture.lastBody.c_str(), "{\"status\":\"error\",\"message\":\"Invalid pump. Use 'pool' or 'solar'\"}");
  ASSERT_TRUE(!dispatchCalled);
  return 0;
}

int test_relative_pump_commands() {
  test_begin("WebRuntimeCommands", "pool and solar toggles stay relative and owner-resolved");
  resetRequest();
  wsCapture.args["pump"] = "pool";
  configuredResult.hasPumpState = true;
  configuredResult.pumpState = true;
  ASSERT_TRUE(PoolController::WebPortal::invokeRouteForTest("/api/pump", HTTP_POST));
  ASSERT_EQ(capturedCommand.type, PoolController::ControllerCommandType::TOGGLE_POOL_PUMP);
  ASSERT_EQ(capturedCommand.source, PoolController::CommandSource::WEB);
  ASSERT_EQ(capturedCommand.toggleModePolicy, PoolController::PumpToggleModePolicy::REQUIRE_MANUAL);
  ASSERT_STREQ(wsCapture.lastBody.c_str(), "{\"status\":\"ok\",\"state\":true}");

  resetRequest();
  wsCapture.args["pump"] = "solar";
  configuredResult.hasPumpState = true;
  configuredResult.pumpState = false;
  ASSERT_TRUE(PoolController::WebPortal::invokeRouteForTest("/api/pump", HTTP_POST));
  ASSERT_EQ(capturedCommand.type, PoolController::ControllerCommandType::TOGGLE_SOLAR_PUMP);
  ASSERT_EQ(capturedCommand.source, PoolController::CommandSource::WEB);
  ASSERT_EQ(capturedCommand.toggleModePolicy, PoolController::PumpToggleModePolicy::REQUIRE_MANUAL);
  ASSERT_STREQ(wsCapture.lastBody.c_str(), "{\"status\":\"ok\",\"state\":false}");
  return 0;
}

int test_owner_rejection_mapping() {
  test_begin("WebRuntimeCommands", "owner rejection keeps the manual-mode HTTP error");
  resetRequest();
  wsCapture.args["pump"] = "pool";
  dispatchAccepted = false;
  ASSERT_TRUE(PoolController::WebPortal::invokeRouteForTest("/api/pump", HTTP_POST));
  ASSERT_EQ(wsCapture.lastStatusCode, 400);
  ASSERT_STREQ(wsCapture.lastBody.c_str(), "{\"status\":\"error\",\"message\":\"Pump control only available in manual mode\"}");
  return 0;
}

int test_adapter_does_not_mutate_nodes() {
  test_begin("WebRuntimeCommands", "Web adapter itself does not mutate mode or relay nodes");
  PoolController::operationModeNode.setMode("auto");
  PoolController::poolPumpNode.setSwitch(false);
  PoolController::solarPumpNode.setSwitch(true);

  resetRequest();
  wsCapture.args["mode"] = "boost";
  ASSERT_TRUE(PoolController::WebPortal::invokeRouteForTest("/api/mode", HTTP_POST));
  ASSERT_STREQ(PoolController::operationModeNode.getMode().c_str(), "auto");

  resetRequest();
  wsCapture.args["pump"] = "pool";
  configuredResult.hasPumpState = true;
  configuredResult.pumpState = true;
  ASSERT_TRUE(PoolController::WebPortal::invokeRouteForTest("/api/pump", HTTP_POST));
  ASSERT_TRUE(!PoolController::poolPumpNode.getSwitch());
  ASSERT_TRUE(PoolController::solarPumpNode.getSwitch());
  return 0;
}

}  // namespace

int run_web_runtime_command_tests() {
  PoolController::WebPortal::begin();
  int passed = 0;
  int failed = 0;
  int (*tests[])() = {test_missing_and_invalid_mode, test_absolute_mode_command, test_cycle_mode_command, test_pump_validation,
    test_relative_pump_commands, test_owner_rejection_mapping, test_adapter_does_not_mutate_nodes};
  for (auto test : tests) {
    if (test() == 0) {
      ++passed;
    } else {
      ++failed;
    }
  }
  test_suite_end("WebRuntimeCommands", passed, failed);
  return failed;
}
''')

          replace_once(
              "test/native/CMakeLists.txt",
              "  ${CMAKE_CURRENT_SOURCE_DIR}/tests/test_webportal_json.cpp\n",
              "  ${CMAKE_CURRENT_SOURCE_DIR}/tests/test_webportal_json.cpp\n  ${CMAKE_CURRENT_SOURCE_DIR}/tests/test_web_runtime_commands.cpp\n"
          )
          replace_once(
              "test/native/tests/test_main.cpp",
              "extern int run_webportal_json_tests();\n",
              "extern int run_webportal_json_tests();\nextern int run_web_runtime_command_tests();\n"
          )
          replace_once(
              "test/native/tests/test_main.cpp",
              "  total += run_webportal_json_tests();\n",
              "  total += run_webportal_json_tests();\n  total += run_web_runtime_command_tests();\n"
          )

          # OpenSpec records this as the first bounded Web mutation slice, not the whole Web migration.
          replace_once(
              "openspec/changes/adapter-command-snapshot-migration/tasks.md",
              "- [ ] Route Web runtime mutations through the same command handler.",
              "- [x] Route `/api/mode` and `/api/pump` Web mutations through the same command handler using owner-resolved relative actions.\n- [ ] Route the remaining Web runtime mutations through the same command handler."
          )
          PY

      - name: Verify focused source ownership gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/WebPortal.cpp').read_text()
          mode = text[text.index('void WebPortal::apiSetMode()'):text.index('void WebPortal::apiTogglePump()')]
          pump = text[text.index('void WebPortal::apiTogglePump()'):text.index('bool WebPortal::isLoginLockedOut()')]
          forbidden = ['operationModeNode', 'poolPumpNode', 'solarPumpNode', 'ConfigManager::getSettings()']
          for name in forbidden:
              assert name not in mode, f'{name} remains in apiSetMode'
              assert name not in pump, f'{name} remains in apiTogglePump'
          PY
          git diff --check

      - name: Commit focused slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ControllerCommandHandler.hpp src/ControllerCommandHandler.cpp src/WebPortal.hpp src/WebPortal.cpp src/main.cpp \
            test/native/CMakeLists.txt test/native/tests/test_main.cpp test/native/tests/test_web_runtime_commands.cpp \
            openspec/changes/adapter-command-snapshot-migration/tasks.md
          git commit -m "refactor(web): route mode and pump mutations through command owner"
          git push origin HEAD:refactor/adapter-command-snapshot-migration
