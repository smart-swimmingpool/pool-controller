name: Apply staged PR 218 web slice

on:
  push:
    branches:
      - refactor/adapter-command-snapshot-migration

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      HEAD_MSG: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and commit
        shell: bash
        run: |
          if [[ "$HEAD_MSG" != "chore(ci): run staged web slice patch" ]]; then
            echo "No staged patch requested"
            exit 0
          fi
          python3 .github/apply_218_web_slice.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ControllerCommandHandler.hpp src/ControllerCommandHandler.cpp src/WebPortal.hpp src/WebPortal.cpp src/main.cpp \
            test/native/CMakeLists.txt test/native/tests/test_main.cpp test/native/tests/test_web_runtime_commands.cpp \
            openspec/changes/adapter-command-snapshot-migration/tasks.md
          git commit -m "refactor(web): route mode and pump mutations through command owner"
          git push origin HEAD:refactor/adapter-command-snapshot-migration
