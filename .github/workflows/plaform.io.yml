---
###########################
###########################
## Platform.io Actions   ##
###########################
###########################
name: PlatformIO CI

#
# Documentation:
# https://docs.platformio.org/en/latest/integration/ci/github-actions.html
#

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.txt"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.txt"

# Cancel in-progress runs for the same workflow+ref when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - environment: esp32dev
            pio-core-dir: ~/.platformio
          - environment: norvi_ae01_r
            pio-core-dir: ~/.platformio
          - environment: olimex_esp32_c6_evb
            pio-core-dir: ~/.platformio-olimex-c6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PlatformIO
        uses: ./.github/actions/setup-platformio
        with:
          pio-core-dir: ${{ matrix.pio-core-dir }}
          cache-key: ${{ runner.os }}-pio-${{ matrix.environment }}-${{ hashFiles('**/platformio.ini') }}
          restore-key: ${{ runner.os }}-pio-${{ matrix.environment }}-

      - name: Run PlatformIO Check
        run: >
          platformio check --environment ${{ matrix.environment }}
          --skip-packages

      - name: Build PlatformIO Project
        run: platformio run --environment ${{ matrix.environment }}

      - name: Publish test firmware binaries
        if: github.event_name == 'pull_request' && github.head_ref == 'test/integration-2026-10-18'
        uses: actions/upload-artifact@v4
        with:
          name: pool-controller-test-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/firmware.bin
            .pio/build/${{ matrix.environment }}/bootloader.bin
            .pio/build/${{ matrix.environment }}/partitions.bin
          if-no-files-found: error
          retention-days: 14
