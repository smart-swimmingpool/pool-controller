---
###########################
###########################
## Platform.io Actions   ##
###########################
###########################
name: PlatformIO CI

#
# Documentation:
# https://docs.platformio.org/en/latest/integration/ci/github-actions.html
#

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.txt"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.txt"

# Cancel in-progress runs for the same workflow+ref when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - environment: esp32dev
            pio-core-dir: ~/.platformio
          - environment: norvi_ae01_r
            pio-core-dir: ~/.platformio
          - environment: olimex_esp32_c6_evb
            pio-core-dir: ~/.platformio-olimex-c6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ${{ matrix.pio-core-dir }}
            .pio
          key: ${{ runner.os }}-pio-${{ matrix.environment }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.environment }}-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio intelhex

      - name: Run PlatformIO Check
        env:
          PLATFORMIO_CORE_DIR: ${{ matrix.pio-core-dir }}
        run: >
          platformio check --environment ${{ matrix.environment }}
          --skip-packages

      - name: Build PlatformIO Project
        env:
          PLATFORMIO_CORE_DIR: ${{ matrix.pio-core-dir }}
        run: platformio run --environment ${{ matrix.environment }}
