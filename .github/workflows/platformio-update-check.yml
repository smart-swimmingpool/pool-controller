name: PlatformIO Update Check

on:
  schedule:
    - cron: '0 0 * * *' # Täglich um Mitternacht ausführen
  workflow_dispatch: # Ermöglicht manuelles Auslösen

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Check for updates
        run: |
          # Hier kannst du ein Skript einfügen, das nach Updates für deine PlatformIO-Abhängigkeiten sucht
          # Zum Beispiel:
          pio pkg update
          pio pkg outdated

      - name: Create issue if updates are available
        if: failure() # Nur ausführen, wenn das vorherige Schritt fehlschlägt (Updates verfügbar)
        uses: actions/github-script@v9
        with:
          script: |
            const issueTitle = 'PlatformIO Updates Available';
            const issueBody = 'Es sind Updates für PlatformIO-Abhängigkeiten verfügbar. Bitte überprüfen und aktualisieren.';

            // Überprüfen, ob bereits ein Issue mit diesem Titel existiert
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              title: issueTitle
            });

            if (existingIssues.data.length === 0) {
              // Erstelle ein neues Issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['enhancement', 'dependencies']
              });
            }