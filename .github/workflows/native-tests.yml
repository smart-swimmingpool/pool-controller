---
##############################
## Native Unit Tests + Code Coverage
##############################
name: Native Tests

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.txt"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "**.txt"

# Cancel in-progress runs for the same workflow+ref when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install project dependencies (ArduinoJson etc.)
        run: pio pkg install --environment esp32dev

      - name: Install lcov for coverage reporting
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lcov

      - name: Configure CMake (native build)
        working-directory: test/native
        run: cmake -B build -S .

      - name: Build native tests
        working-directory: test/native
        run: cmake --build build

      - name: Run native tests
        working-directory: test/native
        run: ASAN_OPTIONS="detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1:detect_invalid_pointer_pairs=2" ./build/test_runner

      - name: Generate lcov coverage report
        if: always()
        run: |
          lcov --capture --directory test/native/build --output-file coverage.info \
            --rc lcov_branch_coverage=1 \
            --ignore-errors unused
          lcov --remove coverage.info \
            '/usr/*' '*/test/*' '*/lib/*' '*/mbedtls/*' '.pio/*' \
            --output-file coverage.info \
            --rc lcov_branch_coverage=1 \
            --ignore-errors unused
          lcov --list coverage.info --rc lcov_branch_coverage=1

      - name: Post coverage summary as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lcovFile = 'coverage.info';
            if (!fs.existsSync(lcovFile)) {
              console.log('No coverage.info found — skipping comment');
              return;
            }
            const content = fs.readFileSync(lcovFile, 'utf8');
            const lines = content.split('\n');
            let lineHit = 0, lineFound = 0, branchHit = 0, branchFound = 0;
            for (const line of lines) {
              if (line.startsWith('DA:')) lineFound++;
              if (line.startsWith('DA:') && !line.endsWith(',0')) lineHit++;
              if (line.startsWith('BRDA:') && line.split(',').length >= 5) {
                const val = line.split(',')[4];
                if (val !== '-') { branchFound++; if (val !== '0') branchHit++; }
              }
            }
            const linePct = lineFound > 0 ? ((lineHit / lineFound) * 100).toFixed(1) : '—';
            const branchPct = branchFound > 0 ? ((branchHit / branchFound) * 100).toFixed(1) : '—';
            const body = `## Native Test Coverage\n\n` +
              `| Metric | Value |\n` +
              `|--------|------:|\n` +
              `| **Line Coverage** | ${linePct}% |\n` +
              `| **Branch Coverage** | ${branchPct}% |\n` +
              `| **Lines Hit/Total** | ${lineHit}/${lineFound} |\n` +
              `| **Branches Hit/Total** | ${branchHit}/${branchFound} |\n\n` +
              `_Report from native unit tests (ASan + gcov)._`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
