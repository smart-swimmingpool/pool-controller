name: Alert `website` repository on `main` or `master` push
on:
  push:
    branches:
      - main
      - master
    # Only trigger when doc-related files change — avoids unnecessary website rebuilds
    paths:
      - docs/**
      - README.md
      - CHANGELOG.md
      - .github/workflows/notify-website-doc.yml
concurrency:
  group: notify-website-${{ github.sha }}
  cancel-in-progress: true
jobs:
  build:
    name: Dispatch to `website` repository for docs regeneration
    runs-on: ubuntu-latest
    env:
      HUGO_DEPLOY_TOKEN: ${{ secrets.HUGO_DEPLOY_TOKEN }}
    steps:
      - name: Check commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/status" --jq '.state')
          if [ "$status" != "success" ]; then
            echo "::warning::Commit status is '$status' — still proceeding, but docs may be from a failed build."
          fi

      - name: Emit repository_dispatch
        id: website_dispatch
        if: env.HUGO_DEPLOY_TOKEN != ''
        run: |
          echo "::add-mask::${HUGO_DEPLOY_TOKEN}"
          http_status=$(curl -sS \
            -o /dev/null \
            -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${HUGO_DEPLOY_TOKEN}" \
            https://api.github.com/repos/smart-swimmingpool/website/dispatches \
            -d '{"event_type":"doc_update"}')
          curl_exit=$?
          if [ "${curl_exit}" -ne 0 ]; then
            echo "::warning::repository_dispatch failed because the API request could not be completed."
          else
            case "${http_status}" in
              [0-9][0-9][0-9])
                if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
                  echo "::warning::repository_dispatch failed with HTTP ${http_status}"
                fi
                ;;
              *)
                echo "::warning::repository_dispatch returned an invalid HTTP status: ${http_status}"
                ;;
            esac
          fi

      - name: Warn when dispatch token is missing
        if: env.HUGO_DEPLOY_TOKEN == ''
        run: echo "::warning::Skipping website dispatch because HUGO_DEPLOY_TOKEN is not configured."
