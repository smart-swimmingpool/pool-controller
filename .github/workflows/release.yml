###########################
###########################
## Release Pipeline       ##
###########################
###########################
name: Release

#
# Documentation:
# https://github.com/googleapis/release-please
#

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

###############
# Set the Job #
###############
jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run Release Please
        uses: google-github-actions/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-firmware:
    name: Build Firmware (${{ matrix.environment }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: [esp32dev, norvi_ae01_r]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio intelhex

      - name: Build firmware
        run: platformio run --environment ${{ matrix.environment }}

      - name: Upload firmware to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BIN=".pio/build/${{ matrix.environment }}/firmware.bin"
          if [ ! -f "${BIN}" ]; then
            echo "Error: firmware binary not found at ${BIN}"
            exit 1
          fi
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "${BIN}#firmware-${{ matrix.environment }}.bin"
