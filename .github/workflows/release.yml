###########################
###########################
## Release Pipeline       ##
###########################
###########################
name: Release

#
# Documentation:
# https://github.com/googleapis/release-please
#

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

###############
# Set the Job #
###############
jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run Release Please
        uses: google-github-actions/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-firmware:
    name: Build Firmware (${{ matrix.environment }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - environment: esp32dev
            pio-core-dir: ~/.platformio
          - environment: norvi_ae01_r
            pio-core-dir: ~/.platformio
          - environment: olimex_esp32_c6_evb
            pio-core-dir: ~/.platformio-olimex-c6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PlatformIO
        uses: ./.github/actions/setup-platformio
        with:
          pio-core-dir: ${{ matrix.pio-core-dir }}
          cache-key: ${{ runner.os }}-pio-${{ matrix.environment }}-${{ hashFiles('**/platformio.ini') }}
          restore-key: ${{ runner.os }}-pio-${{ matrix.environment }}-

      - name: Build firmware
        run: platformio run --environment ${{ matrix.environment }}

      - name: Upload firmware to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BIN=".pio/build/${{ matrix.environment }}/firmware.bin"
          if [ ! -f "${BIN}" ]; then
            echo "Error: firmware binary not found at ${BIN}"
            exit 1
          fi
          ASSET="firmware-${{ matrix.environment }}.bin"
          cp "${BIN}" "/tmp/${ASSET}"
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "/tmp/${ASSET}"
