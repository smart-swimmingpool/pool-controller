---
###########################
###########################
## Linter GitHub Actions ##
###########################
###########################
name: Lint Code Base

#
# Documentation:
# https://help.github.com/en/articles/workflow-syntax-for-github-actions
#

#############################
# Start the job on all push #
#############################
on:
  push:
    branches-ignore:
      - "main"
  pull_request:

# Cancel in-progress runs for the same workflow+ref when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

###############
# Set the Job #
###############
jobs:
  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: super-linter/super-linter@v8.3.1
        env:
          VALIDATE_ALL_CODEBASE: false

          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARKDOWN_CONFIG_FILE: .github/linters/.markdown-lint.yml
          YAML_CONFIG_FILE: .github/linters/.yaml-lint.yml

          # PlatformIO Project Optimizations
          # Exclude build artifacts and dependencies
          FILTER_REGEX_EXCLUDE: .*/(\.pio|\.vscode|\.platformio|build|lib)/.*

          # Enable only relevant linters for PlatformIO project
          # When using selective validation, all other linters are disabled automatically
          # Note: VALIDATE_CLANG_FORMAT not listed - disabled due to version incompatibility
          # cpplint (via VALIDATE_CPP) provides C++ style checking instead
          VALIDATE_CPP: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_GITLEAKS: true
          VALIDATE_BASH: true

          # C/C++ specific settings
          CPP_FILE_EXTENSIONS: "cpp,hpp,h"

          # Don't treat warnings as errors
          WARNINGS_AS_ERRORS: false

          # Logging
          LOG_LEVEL: NOTICE
