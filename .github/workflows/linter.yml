---
###########################
###########################
## Linter GitHub Actions ##
###########################
###########################
name: Lint Code Base

#
# Documentation:
# https://help.github.com/en/articles/workflow-syntax-for-github-actions
#

#############################
# Start the job on all push #
#############################
on:
  push:
    branches-ignore:
      - "main"
  pull_request:

# Cancel in-progress runs for the same workflow+ref when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

###############
# Set the Job #
###############
jobs:
  mega-linter:
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run MegaLinter
        uses: oxsecurity/megalinter@v7
        env:
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE: BASH,CPP,EDITORCONFIG,GITHUB_ACTIONS,GITLEAKS,JSON,MARKDOWN,YAML
          FILTER_REGEX_EXCLUDE: ".*\/(\.pio|\.vscode|\.platformio|build|\.git|node_modules)\/.*|.*\/lib\/.*|.*\/data\/.*|.*\.min\.(js|css)|.*\/test\/.*"
          CPP_FILE_EXTENSIONS: "cpp,hpp,h,c"
          MARKDOWN_LINT_LINE_LENGTH: 150
          MARKDOWNLINT_CONFIG_FILE: .markdownlint.yml
          YAMLLINT_CONFIG_FILE: .yamllint.yml
          PARALLEL: false
          WARNINGS_AS_ERRORS: false
          LOG_LEVEL: NOTICE
