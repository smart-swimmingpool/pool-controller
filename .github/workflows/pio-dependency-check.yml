name: PlatformIO Dependency Check

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  check-dependencies:
    name: Check PlatformIO Library Dependencies (${{ matrix.environment }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        environment: [esp32dev, norvi_ae01_r]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio intelhex

      - name: Check outdated packages (${{ matrix.environment }})
        run: pio pkg outdated --environment ${{ matrix.environment }}
        continue-on-error: true
