# MegaLinter Configuration for pool-controller
# See https://megalinter.io/latest/configuration/
---
APPLY_FIXES: none
DEFAULT_BRANCH: main
SECURITY_SUGGESTIONS: false

# Only enable linters relevant to this project (matching old SuperLinter config)
ENABLE:
  - ACTION
  - BASH
  - C
  - CPP
  - EDITORCONFIG
  - JSON
  - MAKEFILE
  - MARKDOWN
  - SPELL
  - YAML

# Disable specific linters that produce noise
DISABLE:
  - COPYPASTE
  - CSS
  - HTML
  - JAVASCRIPT
  - PYTHON
  - REPOSITORY
  - TYPESCRIPT

DISABLE_LINTERS:
  - MARKDOWN_MARKDOWN_LINK_CHECK
  - MARKDOWN_MARKDOWN_TABLE_FORMATTER
  - SPELL_CSPELL
  - JSON_PRETTIER
  - YAML_PRETTIER
  - YAML_V8R
  - MAKEFILE_CHECKMAKE
  # lychee produces too many false-positive broken link errors in CI
  - SPELL_LYCHEE
  # zizmor is a new linter in v9.5.0 requiring commit-hash-pinned actions
  - ACTION_ZIZMOR

# Exclude third-party and generated files from all applicable linters
# This prevents false positives from ESP-IDF, PlatformIO, and other dependencies
FILTER_REGEX_EXCLUDE: (\.pio|\.vscode|\.platformio|build|lib|test/native/(build|mocks)|node_modules|\.git)/.*

# C/C++ cpplint settings
# Use filters matching SuperLinter defaults to avoid flagging pre-existing code
# Additional filters for ESP-IDF specific patterns and common C++ patterns
C_CPPLINT_ARGUMENTS: >-
  --linelength=130
  --filter=-legal/copyright,-build/include_subdir,-runtime/int,-whitespace/indent,-readability/casting,-build/header_guard,-runtime/threadsafety,-whitespace/line_length,-runtime/string,-runtime/printf,-runtime/references,-readability/todo,-readability/namespace,-build/c++11,-whitespace/newline,-build/namespaces,-readability/multiline-comment-style,-build/include_order
CPP_CPPLINT_ARGUMENTS: >-
  --linelength=130
  --filter=-legal/copyright,-build/include_subdir,-runtime/int,-whitespace/indent,-readability/casting,-build/header_guard,-runtime/threadsafety,-whitespace/line_length,-runtime/string,-runtime/printf,-runtime/references,-readability/todo,-readability/namespace,-build/c++11,-whitespace/newline,-build/namespaces,-readability/multiline-comment-style,-build/include_order

# Markdown settings
MARKDOWN_MARKDOWNLINT_ARGUMENTS: "--config .markdownlint.yml"

# Suppress cppcheck false positives for ESP-IDF macros and informational messages
# syntaxError: cppcheck cannot evaluate ESP-IDF version macros (ESP_IDF_VERSION_VAL)
# info: informational messages that are not actual errors
# Configuration files: ESP-IDF uses many macros that cppcheck cannot evaluate
CPP_CPPCHECK_ARGUMENTS: >-
  --suppress=normalCheckLevelMaxBranches
  --suppress=unknownMacro
  --suppress=syntaxError
  --suppress=ConfigurationNotChecked
  --suppress=ConfigurationIncomplete
  --suppress=preprocessorErrorDirective
  --suppress=toomanyconfigs
