# MegaLinter Configuration for pool-controller
# See https://megalinter.io/7.1.0/configuration/
---
APPLY_FIXES: none
DEFAULT_BRANCH: main

# Only enable linters relevant to this project (matching old SuperLinter config)
ENABLE:
  - ACTION
  - BASH
  - C
  - CPP
  - EDITORCONFIG
  - JSON
  - MAKEFILE
  - MARKDOWN
  - SPELL
  - YAML

# Disable specific linters that produce noise
DISABLE:
  - COPYPASTE
  - CSS
  - HTML
  - JAVASCRIPT
  - PYTHON
  - REPOSITORY
  - TYPESCRIPT

DISABLE_LINTERS:
  - MARKDOWN_MARKDOWN_LINK_CHECK
  - MARKDOWN_MARKDOWN_TABLE_FORMATTER
  - SPELL_CSPELL
  - JSON_PRETTIER
  - YAML_PRETTIER
  - YAML_V8R
  - MAKEFILE_CHECKMAKE

# C/C++ cpplint settings
# Use filters matching SuperLinter defaults to avoid flagging pre-existing code
C_CPPLINT_ARGUMENTS: >-
  --linelength=130
  --filter=-legal/copyright,-build/include_subdir,-runtime/int,-whitespace/indent,-readability/casting,-build/header_guard,-runtime/threadsafety,-whitespace/line_length,-runtime/string,-runtime/printf,-runtime/references,-readability/todo,-readability/namespace,-build/c++11,-whitespace/newline,-build/namespaces
C_CPPLINT_FILTER_REGEX_EXCLUDE: (\.pio|\.vscode|\.platformio|build|lib|test/native/mocks)/.*
CPP_CPPLINT_ARGUMENTS: >-
  --linelength=130
  --filter=-legal/copyright,-build/include_subdir,-runtime/int,-whitespace/indent,-readability/casting,-build/header_guard,-runtime/threadsafety,-whitespace/line_length,-runtime/string,-runtime/printf,-runtime/references,-readability/todo,-readability/namespace,-build/c++11,-whitespace/newline,-build/namespaces
CPP_CPPLINT_FILTER_REGEX_EXCLUDE: (\.pio|\.vscode|\.platformio|build|lib|test/native/mocks)/.*

# Markdown settings
MARKDOWN_MARKDOWNLINT_ARGUMENTS: "--config .markdownlint.yml"
MARKDOWN_MARKDOWNLINT_FILTER_REGEX_EXCLUDE: (\.pio|\.vscode|\.platformio|build|lib|node_modules)/.*

# EditorConfig settings (exclude third-party libs)
EDITORCONFIG_EDITORCONFIG_CHECKER_FILTER_REGEX_EXCLUDE: (\.pio|\.vscode|\.platformio|build|lib|node_modules)/.*

# JSON settings
JSON_JSONLINT_FILTER_REGEX_EXCLUDE: (\.pio|\.vscode|\.platformio|build|lib|node_modules)/.*
