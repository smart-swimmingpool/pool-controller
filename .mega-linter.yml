# MegaLinter Configuration for pool-controller
# See https://megalinter.io/9.5.0/configuration/
---
APPLY_FIXES: none
DEFAULT_BRANCH: main

# Only enable linters relevant to this project (matching old SuperLinter config)
ENABLE:
  - ACTION
  - BASH
  - C
  - CPP
  - EDITORCONFIG
  - JSON
  - MAKEFILE
  - MARKDOWN
  - SPELL
  - YAML

# Disable specific linters that produce noise
DISABLE:
  - COPYPASTE
  - CSS
  - HTML
  - JAVASCRIPT
  - PYTHON
  - REPOSITORY
  - TYPESCRIPT

DISABLE_LINTERS:
  - MARKDOWN_MARKDOWN_LINK_CHECK
  - MARKDOWN_MARKDOWN_TABLE_FORMATTER
  - SPELL_CSPELL
  - JSON_PRETTIER
  - YAML_PRETTIER
  - YAML_V8R
  - MAKEFILE_CHECKMAKE
  # lychee produces too many false-positive broken link errors in CI
  - SPELL_LYCHEE
  # zizmor is a new linter in v9.5.0 requiring commit-hash-pinned actions
  - ACTION_ZIZMOR

# Exclude third-party and generated files from all applicable linters
FILTER_REGEX_EXCLUDE: (\.pio|\.vscode|\.platformio|build|lib|test/native/(build|mocks)|node_modules)/.*

# C/C++ cpplint settings
# Use filters matching SuperLinter defaults to avoid flagging pre-existing code
C_CPPLINT_ARGUMENTS: >-
  --linelength=130
  --filter=-legal/copyright,-build/include_subdir,-runtime/int,-whitespace/indent,-readability/casting,-build/header_guard,-runtime/threadsafety,-whitespace/line_length,-runtime/string,-runtime/printf,-runtime/references,-readability/todo,-readability/namespace,-build/c++11,-whitespace/newline,-build/namespaces
CPP_CPPLINT_ARGUMENTS: >-
  --linelength=130
  --filter=-legal/copyright,-build/include_subdir,-runtime/int,-whitespace/indent,-readability/casting,-build/header_guard,-runtime/threadsafety,-whitespace/line_length,-runtime/string,-runtime/printf,-runtime/references,-readability/todo,-readability/namespace,-build/c++11,-whitespace/newline,-build/namespaces

# Markdown settings
MARKDOWN_MARKDOWNLINT_ARGUMENTS: "--config .markdownlint.yml"

# Suppress cppcheck informational branch limit message (not a real error)
CPP_CPPCHECK_ARGUMENTS: --suppress=normalCheckLevelMaxBranches
